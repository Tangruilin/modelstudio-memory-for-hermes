[project]
name = "modelstudio-memory-for-hermes"
version = "0.1.0"
description = "Hermes Agent memory plugin for Alibaba Cloud Bailian"
requires-python = ">=3.12"
dependencies = ["requests>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0", "pyright>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugins/memory/bailian"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownArgumentType = false
extraPaths = ["/Users/reilly/.hermes/hermes-agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pyright>=1.1.408",
    "pylint>=3.0.0",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
    "types-requests>=2.33.0.20260513",
]

[tool.pylint.main]
py-version = "3.12"
load-plugins = ["pylint.extensions.typing"]

[tool.pylint.typecheck]
signature-mutators = []

[tool.pylint.messages_control]
disable = [
    "C0114", # missing-module-docstring (ruff 已检查)
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "R0801", # duplicate-code
]
